[project]
name = "guy-detector"
version = "0.1.0"
description = "AgiBot X2 near-person deterrence perception node"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "opencv-python-headless>=4.9",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "tomli>=2.0; python_version < '3.11'",
]
detector = [
  "matplotlib>=3.3",
  "pillow>=7.1.2",
  "requests>=2.23",
  "scipy>=1.4.1",
  "psutil>=5.9",
  "polars>=0.20",
  "nvidia-ml-py>=12.0",
]
server = [
  "ultralytics>=8.3",
]

[project.scripts]
guy-detector-node = "guy_detector.ros_node:main"
guy-detector-server = "guy_detector.detector_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
